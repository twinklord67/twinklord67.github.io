<script>
let correctCount = 0;

const music = document.getElementById("music");
music.volume = 0.25;
music.play().catch(() => {});

const months = [
    "January", "February", "March", "April", "May", "June",
    "July", "August", "September", "October", "November", "December"
];

const q1Day    = document.getElementById("q1-day");
const q1Month  = document.getElementById("q1-month");
const q1Hour   = document.getElementById("q1-hour");
const q1Minute = document.getElementById("q1-minute");
const q1Ampm   = document.getElementById("q1-ampm");
const q2Day    = document.getElementById("q2-day");
const q2Month  = document.getElementById("q2-month");

function fillOptions() {
    // Days
    [q1Day, q2Day].forEach(function(sel) {
        let html = '<option value="">Day</option>';
        for (let i = 1; i <= 31; i++) {
            html += '<option value="' + i + '">' + i + '</option>';
        }
        sel.innerHTML = html;
    });

    // Months — fixed & safe version
    [q1Month, q2Month].forEach(function(sel) {
        let html = '<option value="">Month</option>';
        for (let i = 0; i < months.length; i++) {
            let value = i + 1;
            let month = months[i];
            html += '<option value="' + value + '">' + month + '</option>';
        }
        sel.innerHTML = html;
    });

    // Hours
    let hourHtml = '<option value="">Hour</option>';
    for (let i = 1; i <= 12; i++) {
        hourHtml += '<option value="' + i + '">' + i + '</option>';
    }
    q1Hour.innerHTML = hourHtml;

    // Minutes
    let minHtml = '<option value="">Minute</option>';
    for (let i = 0; i < 60; i++) {
        let v = i.toString().padStart(2, '0');
        minHtml += '<option value="' + v + '">' + v + '</option>';
    }
    q1Minute.innerHTML = minHtml;
}

// Run once DOM is ready
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', fillOptions);
} else {
    fillOptions();
}

// Heart burst effect (unchanged)
function burst(x, y) {
    const ding = document.getElementById("ding");
    ding.play();
    for (let i = 0; i < 14; i++) {
        const h = document.createElement("div");
        h.className = "heart";
        h.innerHTML = "💖";
        h.style.left = x + "px";
        h.style.top = y + "px";
        h.style.setProperty("--x", (Math.random() * 200 - 100) + "px");
        h.style.setProperty("--y", (Math.random() * -200) + "px");
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 1000);
    }
}

function reward(el) {
    const r = el.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top);
}

function winCheck() {
    if (correctCount === 5) {
        setTimeout(() => location.href = "final.html", 1200);
    }
}

// Check functions (unchanged from your last version)
function checkQ1() {
    if (q1Day.value == "8" && q1Month.value == "3" && q1Hour.value == "10" && q1Minute.value == "23" && q1Ampm.value == "AM") {
        f1.innerHTML = "<span class='correct'>yes</span>";
        reward(f1);
        correctCount++;
        winCheck();
    } else {
        f1.innerHTML = "<span class='wrong'>no dumbass</span>";
    }
}

function checkQ2() {
    if (q2Day.value == "11" && q2Month.value == "2") {
        f2.innerHTML = "<span class='correct'>yes</span>";
        reward(f2);
        correctCount++;
        winCheck();
    } else {
        f2.innerHTML = "<span class='wrong'>no dumbass</span>";
    }
}

function checkQ3() {
    if (q3.value.toLowerCase().includes("sponge")) {
        f3.innerHTML = "<span class='correct'>yes</span>";
        reward(f3);
        correctCount++;
        winCheck();
    } else {
        f3.innerHTML = "<span class='wrong'>no dumbass</span>";
    }
}

function checkQ4() {
    let v = parseFloat(q4.value);
    if (!isNaN(v) && Math.abs(v - 6.1) < 0.1) {
        f4.innerHTML = "<span class='correct'>yes</span>";
        reward(f4);
        correctCount++;
        winCheck();
    } else {
        f4.innerHTML = "<span class='wrong'>no dumbass</span>";
    }
}

function checkQ5() {
    if (q5.value.trim().length > 4) {
        f5.innerHTML = "<span class='correct'>yes</span>";
        reward(f5);
        correctCount++;
        winCheck();
    } else {
        f5.innerHTML = "<span class='wrong'>no dumbass</span>";
    }
}
</script>
