<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Our little questions ♡</title>
  <style>
    .correct::before {
      content: "💖 ";
      animation: tiny-heart 1.2s infinite;
    }
    
    @keyframes tiny-heart {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.3); }
    }
    body {
      margin: 0;
      padding: 40px 20px;
      background: linear-gradient(135deg, #fff5fb 0%, #ffeef4 50%, #fff0f8 100%);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #4a2c3b;
      text-align: center;
      min-height: 100vh;
      opacity: 0;
      animation: pageFadeIn 0.9s ease-out forwards;
    }
  
    @keyframes pageFadeIn {
      to { opacity: 1; }
    }
  
    h1 {
      color: #ff4d94;
      font-size: 3.1rem;
      font-weight: 700;
      margin: 20px 0 50px;
      letter-spacing: -0.5px;
    }
  
    .question-box {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 32px;
      margin: 40px auto;
      max-width: 740px;
      border-radius: 28px;
      box-shadow: 0 16px 50px rgba(255, 105, 180, 0.18);
      border: 1px solid rgba(255, 182, 193, 0.4);
      text-align: left;
      font-size: 1.32rem;
      line-height: 1.65;
      transition: all 0.35s ease;
    }
  
    .question-box:hover {
      transform: translateY(-4px);
      box-shadow: 0 24px 70px rgba(255, 105, 180, 0.25);
    }
  
    .question-title {
      color: #ff2e7e;
      font-weight: 700;
      margin-bottom: 16px;
      font-size: 1.38rem;
    }
  
    .input-area {
      margin-top: 22px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      justify-content: center;
    }
  
    select, input[type="text"], input[type="number"], textarea {
      padding: 12px 18px;
      font-size: 1.1rem;
      border: 2px solid #ffcce6;
      border-radius: 16px;
      background: #fff8fc;
      transition: all 0.25s;
    }
  
    select:focus, input:focus, textarea:focus {
      outline: none;
      border-color: #ff69b4;
      box-shadow: 0 0 0 4px rgba(255, 105, 180, 0.15);
    }
  
    button {
      padding: 12px 32px;
      font-size: 1.15rem;
      font-weight: 600;
      background: linear-gradient(135deg, #ff69b4, #ff4d94);
      color: white;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(255, 105, 180, 0.3);
    }
  
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 105, 180, 0.45);
    }
  
    .feedback {
      margin-top: 18px;
      font-size: 1.28rem;
      font-weight: 500;
      min-height: 1.6em;
    }
  
    .correct { color: #2ecc71; }
    .wrong   { color: #e74c3c; }
  
    .back-btn {
      display: inline-block;
      margin-top: 60px;
      padding: 16px 44px;
      background: linear-gradient(135deg, #ffb6c1, #ff85c0);
      color: white;
      border-radius: 999px;
      text-decoration: none;
      font-size: 1.3rem;
      font-weight: 600;
      box-shadow: 0 6px 20px rgba(255, 182, 193, 0.4);
      transition: all 0.3s;
    }
  
    .back-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 35px rgba(255, 182, 193, 0.55);
    }
  </style>
</head>
<body>

  <h1>Our little questions ♡</h1>

  <!-- Question 1 -->
  <div class="question-box">
    <div class="question-title">1. When did we first get married?</div>
    <div class="input-area">
      <select id="q1-day">
        <option value="">Day</option>
        <option value="8">8</option>
      </select>
      <select id="q1-month">
        <option value="">Month</option>
        <option value="3">March</option>
      </select>
      <select id="q1-year">
        <option value="">Year</option>
        <option value="2025">2025</option>
      </select>
      <select id="q1-hour">
        <option value="">Hour</option>
        <option value="10">10</option>
      </select>
      <select id="q1-minute">
        <option value="">Minute</option>
        <option value="23">23</option>
      </select>
      <select id="q1-ampm">
        <option value="">AM/PM</option>
        <option value="AM">AM</option>
      </select>
      <button onclick="checkQ1()">Check</button>
    </div>
    <div id="feedback1" class="feedback"></div>
  </div>

  <!-- Question 2 -->
  <div class="question-box">
    <div class="question-title">2. When did we start talking?</div>
    <div class="input-area">
      <select id="q2-day">
        <option value="">Day</option>
        <option value="11">11</option>
      </select>
      <select id="q2-month">
        <option value="">Month</option>
        <option value="2">February</option>
      </select>
      <select id="q2-year">
        <option value="">Year</option>
        <option value="2025">2025</option>
      </select>
      <button onclick="checkQ2()">Check</button>
    </div>
    <div id="feedback2" class="feedback"></div>
  </div>

  <!-- Question 3 -->
  <div class="question-box">
    <div class="question-title">3. What did I name your left boob?</div>
    <div class="input-area">
      <input type="text" id="q3-answer" placeholder="Type the name..." />
      <button onclick="checkQ3()">Check</button>
    </div>
    <div id="feedback3" class="feedback"></div>
  </div>

  <!-- Question 4 -->
  <div class="question-box">
    <div class="question-title">4. How long is my pp?</div>
    <div class="input-area">
      <input type="number" id="q4-length" step="0.1" min="0" max="20" placeholder="Length in inches" />
      <span style="font-size:1.2em;">inches</span>
      <button onclick="checkQ4()">Check</button>
    </div>
    <div id="feedback4" class="feedback"></div>
  </div>

  <!-- Question 5 (open-ended) -->
  <div class="question-box">
    <div class="question-title">5. How bad do you want me :3 ?</div>
    <div class="input-area" style="flex-direction: column; gap: 20px;">
      <textarea id="q5-answer" rows="4" style="width: 90%; max-width: 500px; padding: 12px; font-size: 1.1em;" placeholder="Tell me everything..."></textarea>
      <button onclick="showQ5()">Submit your answer ♡</button>
    </div>
    <div id="feedback5" class="feedback"></div>
  </div>

  <a href="index.html" class="back-btn">Back to start</a>

  <script>
    function checkQ1() {
      const day = document.getElementById("q1-day").value;
      const month = document.getElementById("q1-month").value;
      const year = document.getElementById("q1-year").value;
      const hour = document.getElementById("q1-hour").value;
      const minute = document.getElementById("q1-minute").value;
      const ampm = document.getElementById("q1-ampm").value;

      const feedback = document.getElementById("feedback1");

      if (day === "8" && month === "3" && year === "2025" &&
          hour === "10" && minute === "23" && ampm === "AM") {
        feedback.innerHTML = "<span class='correct'>Yesss! 8th March 2025, 10:23 AM ♡</span>";
      } else {
        feedback.innerHTML = "<span class='wrong'>Not quite... try again cutie</span>";
      }
    }

    function checkQ2() {
      const day = document.getElementById("q2-day").value;
      const month = document.getElementById("q2-month").value;
      const year = document.getElementById("q2-year").value;

      const feedback = document.getElementById("feedback2");

      if (day === "11" && month === "2" && year === "2025") {
        feedback.innerHTML = "<span class='correct'>Perfect! 11th February 2025 ♡</span>";
      } else {
        feedback.innerHTML = "<span class='wrong'>Hmm... think again baby</span>";
      }
    }

    function checkQ3() {
      const answer = document.getElementById("q3-answer").value.trim().toLowerCase();
      const feedback = document.getElementById("feedback3");

      if (answer === "spongeboob") {
        feedback.innerHTML = "<span class='correct'>Spongeboob!!! My favorite name ever 😂💕</span>";
      } else {
        feedback.innerHTML = "<span class='wrong'>Nope... it's cuter than that</span>";
      }
    }

    function checkQ4() {
      const length = parseFloat(document.getElementById("q4-length").value);
      const feedback = document.getElementById("feedback4");

      if (Math.abs(length - 6.1) < 0.05) {  // small tolerance for floating point
        feedback.innerHTML = "<span class='correct'>6.1 inches... you know it so well 😏</span>";
      } else {
        feedback.innerHTML = "<span class='wrong'>Close... but not quite</span>";
      }
    }

    function showQ5() {
      const answer = document.getElementById("q5-answer").value.trim();
      const feedback = document.getElementById("feedback5");

      if (answer.length < 5) {
        feedback.innerHTML = "<span class='wrong'>Tell me more... I wanna hear everything :3</span>";
      } else {
        feedback.innerHTML = "<span class='correct'>Awww... " + answer + "<br>I want you even more ♡♡♡</span>";
      }
    }
  </script>

</body>
</html>
