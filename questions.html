<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our little questions ♡</title>

<style>
body{
margin:0;
padding:40px 20px;
background:linear-gradient(135deg,#fff5fb,#ffeef4,#fff0f8);
font-family:system-ui;
text-align:center;
color:#4a2c3b;
animation:fade 1s forwards;
}
@keyframes fade{to{opacity:1}}

h1{color:#ff4d94;font-size:3rem;margin-bottom:50px}

.question-box{
background:white;
padding:32px;
max-width:720px;
margin:40px auto;
border-radius:26px;
box-shadow:0 15px 40px rgba(255,105,180,.25);
transition:.3s;
}
.question-box:hover{transform:translateY(-4px)}

.input-area{margin-top:20px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center}

select,input,textarea{
padding:12px 16px;
border:2px solid #ffcce6;
border-radius:14px;
font-size:1.05rem;
background:#fff8fc;
}

button{
padding:12px 30px;
border:none;
border-radius:999px;
background:linear-gradient(135deg,#ff69b4,#ff4d94);
color:white;
font-size:1.1rem;
cursor:pointer;
box-shadow:0 4px 14px rgba(255,105,180,.4);
}

.feedback{margin-top:16px;font-size:1.25rem;min-height:1.6em}
.correct{color:#2ecc71}
.wrong{color:#e74c3c}

.heart{
position:fixed;
font-size:18px;
pointer-events:none;
animation:burst 1s ease-out forwards;
}

@keyframes burst{
0%{transform:scale(1);opacity:1}
100%{transform:translate(var(--x),var(--y)) scale(0);opacity:0}
}
</style>
</head>

<body>

<h1>Our little questions ♡</h1>

<audio id="music" src="music.mp3" loop></audio>
<audio id="ding" src="ding.mp3"></audio>

<div class="question-box">
<div>1. When did we first get married?</div>
<div class="input-area">
<select id="d1"><option></option><option>8</option></select>
<select id="m1"><option></option><option>3</option></select>
<select id="y1"><option></option><option>2025</option></select>
<select id="h1"><option></option><option>10</option></select>
<select id="min1"><option></option><option>23</option></select>
<select id="ap1"><option></option><option>AM</option></select>
<button onclick="check1()">Check</button>
</div>
<div id="f1" class="feedback"></div>
</div>

<div class="question-box">
<div>2. When did we start talking?</div>
<div class="input-area">
<select id="d2"><option></option><option>11</option></select>
<select id="m2"><option></option><option>2</option></select>
<select id="y2"><option></option><option>2025</option></select>
<button onclick="check2()">Check</button>
</div>
<div id="f2" class="feedback"></div>
</div>

<div class="question-box">
<div>3. What did I name your left boob?</div>
<div class="input-area">
<input id="q3">
<button onclick="check3()">Check</button>
</div>
<div id="f3" class="feedback"></div>
</div>

<div class="question-box">
<div>4. How long is my pp?</div>
<div class="input-area">
<input type="number" id="q4" step="0.1">
<button onclick="check4()">Check</button>
</div>
<div id="f4" class="feedback"></div>
</div>

<div class="question-box">
<div>5. How bad do you want me?</div>
<div class="input-area" style="flex-direction:column">
<textarea id="q5" rows="4" style="width:90%"></textarea>
<button onclick="check5()">Submit ♡</button>
</div>
<div id="f5" class="feedback"></div>
</div>

<script>
let correctCount=0;

const music=document.getElementById("music");
music.volume=0.2;
music.play().catch(()=>{});

function burst(x,y){
for(let i=0;i<14;i++){
let h=document.createElement("div");
h.className="heart";
h.innerHTML="💖";
h.style.left=x+"px";
h.style.top=y+"px";
h.style.setProperty("--x",(Math.random()*200-100)+"px");
h.style.setProperty("--y",(Math.random()*-200)+"px");
document.body.appendChild(h);
setTimeout(()=>h.remove(),1000);
}
}

function reward(el){
document.getElementById("ding").play();
const r=el.getBoundingClientRect();
burst(r.left+r.width/2,r.top);
}

function winCheck(){
if(correctCount===5){
setTimeout(()=>location.href="final.html",1200);
}
}

function check1(){
if(d1.value==8&&m1.value==3&&y1.value==2025&&h1.value==10&&min1.value==23&&ap1.value=="AM"){
f1.innerHTML="<span class='correct'>Perfect ♡</span>";
reward(f1);correctCount++;winCheck();
}else f1.innerHTML="<span class='wrong'>Try again cutie</span>";
}

function check2(){
if(d2.value==11&&m2.value==2&&y2.value==2025){
f2.innerHTML="<span class='correct'>Yess ♡</span>";
reward(f2);correctCount++;winCheck();
}else f2.innerHTML="<span class='wrong'>Nope</span>";
}

function check3(){
if(q3.value.toLowerCase().includes("sponge")){
f3.innerHTML="<span class='correct'>Spongeboob 😆</span>";
reward(f3);correctCount++;winCheck();
}else f3.innerHTML="<span class='wrong'>Wrong</span>";
}

function check4(){
let v=parseFloat(q4.value);
if(!isNaN(v)&&Math.abs(v-6.1)<0.1){
f4.innerHTML="<span class='correct'>6.1 inches 😏</span>";
reward(f4);correctCount++;winCheck();
}else f4.innerHTML="<span class='wrong'>Nope</span>";
}

function check5(){
if(q5.value.trim().length>4){
f5.innerHTML="<span class='correct'>I love hearing that ♡</span>";
reward(f5);correctCount++;winCheck();
}else f5.innerHTML="<span class='wrong'>Write moreeee</span>";
}
}
</script>

</body>
</html>
