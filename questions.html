<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our little questions ♡</title>
<style>
body {
    margin: 0;
    padding: 30px 15px;
    background: linear-gradient(135deg, #fff5fb, #ffeef4);
    font-family: system-ui;
    text-align: center;
    color: #333;
}
h1 { color: #ff4d94; font-size: 2.5rem; margin-bottom: 30px; }
.question-box {
    background: white;
    padding: 20px;
    margin: 20px auto;
    max-width: 600px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(255,105,180,0.2);
}
.input-area { margin-top: 15px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
select, input, textarea {
    padding: 10px;
    border: 2px solid #ffcce6;
    border-radius: 10px;
    font-size: 1rem;
}
button {
    padding: 10px 25px;
    background: linear-gradient(135deg,#ff69b4,#ff4d94);
    color: white;
    border: none;
    border-radius: 999px;
    cursor: pointer;
}
.feedback {
    margin-top: 12px;
    font-size: 1.3rem;
    font-weight: bold;
}
.correct { color: #2ecc71; }
.wrong   { color: #e74c3c; }
</style>
</head>
<body>

<h1>Our little questions ♡</h1>

<!-- Q1 -->
<div class="question-box">
    <div>1. When did we first get married?</div>
    <div class="input-area">
        <select id="q1-day"><option value="">Day</option></select>
        <select id="q1-month"><option value="">Month</option></select>
        <select id="q1-hour"><option value="">Hour</option></select>
        <select id="q1-minute"><option value="">Minute</option></select>
        <select id="q1-ampm">
            <option value="">AM/PM</option>
            <option>AM</option>
            <option>PM</option>
        </select>
        <button onclick="checkQ1()">Check</button>
    </div>
    <div id="f1" class="feedback"></div>
</div>

<!-- Q2 -->
<div class="question-box">
    <div>2. When did we start talking?</div>
    <div class="input-area">
        <select id="q2-day"><option value="">Day</option></select>
        <select id="q2-month"><option value="">Month</option></select>
        <button onclick="checkQ2()">Check</button>
    </div>
    <div id="f2" class="feedback"></div>
</div>

<!-- Q3 -->
<div class="question-box">
    <div>3. What did I name your left boob?</div>
    <div class="input-area">
        <input id="q3" placeholder="Type here">
        <button onclick="checkQ3()">Check</button>
    </div>
    <div id="f3" class="feedback"></div>
</div>

<!-- Q4 -->
<div class="question-box">
    <div>4. How long is my pp?</div>
    <div class="input-area">
        <input type="number" id="q4" step="0.1" placeholder="Number">
        <button onclick="checkQ4()">Check</button>
    </div>
    <div id="f4" class="feedback"></div>
</div>

<!-- Q5 -->
<div class="question-box">
    <div>5. How bad do you want me?</div>
    <div class="input-area" style="flex-direction:column;">
        <textarea id="q5" rows="3" placeholder="Write something..." style="width:100%;"></textarea>
        <button onclick="checkQ5()">Submit</button>
    </div>
    <div id="f5" class="feedback"></div>
</div>

<script>
const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function populateDropdowns() {
    // Days
    document.querySelectorAll('#q1-day, #q2-day').forEach(sel => {
        for(let i=1; i<=31; i++) {
            let opt = document.createElement('option');
            opt.value = i;
            opt.text = i;
            sel.add(opt);
        }
    });

    // Months
    document.querySelectorAll('#q1-month, #q2-month').forEach(sel => {
        months.forEach((m, idx) => {
            let opt = document.createElement('option');
            opt.value = idx + 1;
            opt.text = m;
            sel.add(opt);
        });
    });

    // Hours
    for(let i=1; i<=12; i++) {
        let opt = document.createElement('option');
        opt.value = i;
        opt.text = i;
        document.getElementById('q1-hour').add(opt);
    }

    // Minutes
    for(let i=0; i<60; i++) {
        let v = i.toString().padStart(2, '0');
        let opt = document.createElement('option');
        opt.value = v;
        opt.text = v;
        document.getElementById('q1-minute').add(opt);
    }
}

populateDropdowns();

let correctCount = 0;

function checkQ1() {
    let f = document.getElementById('f1');
    if (document.getElementById('q1-day').value == "8" &&
        document.getElementById('q1-month').value == "3" &&
        document.getElementById('q1-hour').value == "10" &&
        document.getElementById('q1-minute').value == "23" &&
        document.getElementById('q1-ampm').value == "AM") {
        f.innerHTML = '<span class="correct">yes</span>';
        correctCount++;
        if (correctCount === 5) setTimeout(() => location.href = "final.html", 800);
    } else {
        f.innerHTML = '<span class="wrong">no dumbass</span>';
    }
}

function checkQ2() {
    let f = document.getElementById('f2');
    if (document.getElementById('q2-day').value == "11" &&
        document.getElementById('q2-month').value == "2") {
        f.innerHTML = '<span class="correct">yes</span>';
        correctCount++;
        if (correctCount === 5) setTimeout(() => location.href = "final.html", 800);
    } else {
        f.innerHTML = '<span class="wrong">no dumbass</span>';
    }
}

function checkQ3() {
    let val = document.getElementById('q3').value.toLowerCase();
    let f = document.getElementById('f3');
    if (val.includes("sponge")) {
        f.innerHTML = '<span class="correct">yes</span>';
        correctCount++;
        if (correctCount === 5) setTimeout(() => location.href = "final.html", 800);
    } else {
        f.innerHTML = '<span class="wrong">no dumbass</span>';
    }
}

function checkQ4() {
    let val = parseFloat(document.getElementById('q4').value);
    let f = document.getElementById('f4');
    if (!isNaN(val) && Math.abs(val - 6.1) < 0.1) {
        f.innerHTML = '<span class="correct">yes</span>';
        correctCount++;
        if (correctCount === 5) setTimeout(() => location.href = "final.html", 800);
    } else {
        f.innerHTML = '<span class="wrong">no dumbass</span>';
    }
}

function checkQ5() {
    let val = document.getElementById('q5').value.trim();
    let f = document.getElementById('f5');
    if (val.length > 4) {
        f.innerHTML = '<span class="correct">yes</span>';
        correctCount++;
        if (correctCount === 5) setTimeout(() => location.href = "final.html", 800);
    } else {
        f.innerHTML = '<span class="wrong">no dumbass</span>';
    }
}
</script>

</body>
</html>
