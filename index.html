<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To My Love</title>

  <style>
    body {
      background: #fff0f5;          /* very light pink */
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
      color: #333;
      margin: 0;
      min-height: 100vh;
    }

    h1 {
      color: #e91e63;              /* hot pink */
      font-size: 3.5em;
      margin: 20px 0 10px;
    }

    .heart {
      color: #e91e63;
      font-size: 1.4em;
    }

    p {
      line-height: 1.6;
    }

    /* Button styles */
    .ready-btn {
      display: inline-block;
      padding: 18px 50px;
      font-size: 1.6em;
      font-weight: bold;
      background: #ff69b4;
      color: white;
      border-radius: 999px;
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(255, 105, 180, 0.5);
      transition: all 0.3s ease;
      margin: 60px 0 100px;
    }

    .ready-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 10px 30px rgba(255, 105, 180, 0.7);
    }

    .ready-btn span {
      font-size: 1.4em;
    }
  </style>
</head>
<body>

  <h1>Happy Valentine's Day, my tiny dumbass! <span class="heart">❤️</span></h1>

  <p style="font-size: 1.4em; margin: 40px 0;">
    This is stupid<br>
    I know I've made apps for you before but this one's so stupid<br>
    because you're my favorite person in the world.
  </p>

  <p style="font-size: 1.2em; color: #555; margin-bottom: 60px;">
    (this is just the beginning — we'll make it much cuter together)
  </p>

  <!-- The button is here now -->
  <a href="questions.html" class="ready-btn">
    You ready? <span>❤️</span>
  </a>

</body>
</html>
