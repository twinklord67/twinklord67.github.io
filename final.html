<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>final.html (skibidi sigma ending)</title>
  <style>
    :root {
      --bg: #000;
      --text: #ff69b4;
      --accent: #ff1493;
      --error: #0f0;
      --white: #fff;
    }

    body {
      margin: 0;
      height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: background 1.5s, transform 0.4s;
    }

    #container {
      text-align: center;
      max-width: 92%;
      padding: 20px;
      position: relative;
      z-index: 2;
    }

    h1 {
      font-size: clamp(3.5rem, 14vw, 8rem);
      margin: 0.4em 0;
      color: var(--text);
      text-shadow: 0 0 30px var(--accent);
      animation: pulse-glow 5s infinite alternate;
    }

    @keyframes pulse-glow {
      from { text-shadow: 0 0 20px var(--accent); transform: scale(1); }
      to   { text-shadow: 0 0 80px var(--accent), 0 0 140px #c71585; transform: scale(1.05); }
    }

    .confession {
      font-size: clamp(1.6rem, 6vw, 2.8rem);
      line-height: 1.45;
      margin: 1.8em 0;
      opacity: 0;
      transform: translateY(50px);
      transition: all 1.6s ease-out;
    }

    .confession.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .final-chaos {
      font-size: clamp(2.8rem, 10vw, 6rem);
      font-weight: 900;
      color: var(--white);
      text-shadow: 0 0 40px #ff00aa, 0 0 80px #ff0066;
      animation: crazy-shake 0.12s infinite, color-flash 0.8s infinite;
      margin: 1.2em 0;
    }

    @keyframes crazy-shake {
      0%,100% { transform: translate(0,0) rotate(0deg); }
      25% { transform: translate(-8px, 6px) rotate(-2deg); }
      50% { transform: translate(10px, -8px) rotate(3deg); }
      75% { transform: translate(-6px, 10px) rotate(-1deg); }
    }

    @keyframes color-flash {
      0%,100% { color: #ff69b4; }
      20%  { color: #00ffff; }
      40%  { color: #ffff00; }
      60%  { color: #ff00ff; }
      80%  { color: #00ff00; }
    }

    .adopted {
      font-size: clamp(4rem, 15vw, 9rem);
      color: #ff0044;
      text-shadow: 0 0 50px #ff0044;
      animation: adopted-bounce 1.2s infinite;
    }

    @keyframes adopted-bounce {
      0%,100% { transform: scale(1); }
      50%     { transform: scale(1.12); }
    }

    .iloveu {
      font-size: clamp(5rem, 18vw, 12rem);
      color: #fff;
      background: linear-gradient(90deg, #ff69b4, #ff1493, #c71585);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: heartbeat 1.8s infinite;
    }

    @keyframes heartbeat {
      0%,100% { transform: scale(1); }
      50%     { transform: scale(1.08); }
    }

    .btn {
      padding: 16px 50px;
      font-size: 2rem;
      margin: 25px 12px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.35s;
    }

    #keep { background: linear-gradient(135deg, #ff69b4, #ff1493); color: white; }
    #stop  { background: #333; color: white; }

    #keep:hover { transform: scale(1.18); box-shadow: 0 0 40px #ff69b4; }
    #stop:hover  { transform: scale(1.1); }

    #hearts-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      font-size: 2.2rem;
      animation: rise-twist 7s linear infinite;
      opacity: 0.75;
      pointer-events: none;
    }

    @keyframes rise-twist {
      0%   { transform: translateY(120vh) rotate(0deg); }
      100% { transform: translateY(-30vh) rotate(1440deg); }
    }

    #explosion {
      position: fixed;
      inset: 0;
      background: #000;
      display: none;
      z-index: 999;
      align-items: center;
      justify-content: center;
      font-size: 8rem;
      color: #ff0044;
      text-shadow: 0 0 60px #ff0044, 0 0 120px #ff00aa;
      flex-direction: column;
    }

    #boom-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, #ff0044 0%, transparent 70%);
      opacity: 0;
      animation: boom-flash 1.8s forwards;
      pointer-events: none;
    }

    @keyframes boom-flash {
      0%   { opacity: 0; transform: scale(0.5); }
      30%  { opacity: 0.9; transform: scale(1.6); }
      100% { opacity: 0; transform: scale(3); }
    }

    .youre-gay {
      font-size: clamp(6rem, 22vw, 14rem);
      font-weight: 900;
      color: #00ffff;
      text-shadow: 0 0 50px #00ffff, 0 0 100px #00aaff;
      animation: glitch-text 0.6s infinite;
    }

    @keyframes glitch-text {
      0% { transform: translate(0); }
      20% { transform: translate(-5px, 5px); }
      40% { transform: translate(5px, -5px); }
      60% { transform: translate(-3px, 3px); }
      80% { transform: translate(3px, -3px); }
      100% { transform: translate(0); }
    }
  </style>
</head>
<body>

  <div id="hearts-container"></div>

  <div id="container">
    <h1>my baby rat 🐭</h1>

    <div id="step1" class="confession visible">
      <p>a stupid unloved gay orphan met you</p>
      <p>and the whole boring world went 💥</p>
    </div>

    <div id="step2" class="confession">
      <p class="glitch" data-text="now you're my favorite disaster">now you're my favorite disaster</p>
    </div>

    <div id="step3" class="confession">
      <p>i'd pick you every time</p>
      <p>even when you're being extra terrorist-coded</p>
    </div>

    <div id="buttons">
      <button id="keep" class="btn" onclick="nextStep()">keep going 💖</button>
      <button id="stop" class="btn" onclick="fakeEnd()">stop pls</button>
    </div>
  </div>

  <div id="explosion">
    <div id="boom-overlay"></div>
    <div class="youre-gay">you're gay</div>
    <p style="font-size:2.5rem; margin-top:2rem; color:#ff69b4;">
      happy valentine's my skibidi sigma dumbass
    </p>
  </div>

  <script>
    let step = 1;
    const maxSteps = 3;

    function nextStep() {
      if (step < maxSteps) {
        document.getElementById(`step${step}`).classList.remove('visible');
        step++;
        setTimeout(() => {
          document.getElementById(`step${step}`).classList.add('visible');
          addHearts(8);
        }, 900);
      } else {
        goToChaosEnding();
      }
    }

    function fakeEnd() {
      document.body.style.transform = 'scale(1.3)';
      setTimeout(goToChaosEnding, 600);
    }

    function goToChaosEnding() {
      document.getElementById('container').style.display = 'none';
      document.body.style.background = '#111';

      // Show final chaos slide for a bit
      const chaosDiv = document.createElement('div');
      chaosDiv.style.position = 'fixed';
      chaosDiv.style.inset = '0';
      chaosDiv.style.display = 'flex';
      chaosDiv.style.flexDirection = 'column';
      chaosDiv.style.alignItems = 'center';
      chaosDiv.style.justifyContent = 'center';
      chaosDiv.style.zIndex = '10';
      chaosDiv.innerHTML = `
        <div class="final-chaos">thank you so much my skibidi sigma</div>
        <div class="adopted" id="adopted-text">You're adopted</div>
      `;
      document.body.appendChild(chaosDiv);

      // Ramp up hearts insanely
      let heartInterval = setInterval(() => {
        addHearts(15);
      }, 400);

      // After \~4 seconds → I love you → explosion
      setTimeout(() => {
        chaosDiv.innerHTML = `
          <div class="iloveu">I LOVE YOU</div>
        `;
        addHearts(30);
      }, 4200);

      setTimeout(() => {
        clearInterval(heartInterval);
        document.body.innerHTML = '';
        document.getElementById('explosion').style.display = 'flex';
        addHearts(60); // final flood
      }, 6800);
    }

    function addHearts(count) {
      const container = document.getElementById('hearts-container');
      for (let i = 0; i < count; i++) {
        const h = document.createElement('div');
        h.className = 'heart';
        h.innerHTML = ['💖','💕','💗','💞','❤️‍🔥','🫶'][Math.floor(Math.random()*6)];
        h.style.left = Math.random() * 100 + 'vw';
        h.style.top = '100vh';
        h.style.fontSize = (Math.random() * 2 + 1.5) + 'rem';
        h.style.animationDuration = (Math.random() * 5 + 5) + 's';
        h.style.animationDelay = Math.random() * 1.5 + 's';
        container.appendChild(h);
        setTimeout(() => h.remove(), 10000);
      }
    }

    // Start with some gentle hearts
    addHearts(12);
  </script>
</body>
</html>
